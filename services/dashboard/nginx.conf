server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Hashed asset files never change; index.html always revalidates.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
