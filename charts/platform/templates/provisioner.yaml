{{- if .Values.provisioner.enabled }}
{{- /*
The store provisioner. Every extra store gets its own namespace
(<prefix><name>) with its own quota and limits. Creating namespaces needs
cluster-wide rights, so the provisioner's writes are fenced in by an admission
policy: it may only change namespaces labelled as its stores, and objects inside
them. It holds no rights at all in the platform namespace, so neither it nor a
store can touch the gateway, its database or its secrets.
*/ -}}
{{- $r := .Release.Name -}}
{{- $name := printf "%s-provisioner" $r -}}
{{- $prefix := .Values.provisioner.namespacePrefix | default (printf "%s-store-" .Release.Namespace) -}}
{{- $ownerId := printf "%s.%s" .Release.Namespace $r -}}
{{- $sa := printf "system:serviceaccount:%s:%s" .Release.Namespace $name -}}
{{- $store := .Values.store -}}
{{- $woo := index .Values "woo-mcp" -}}
{{- /* Values every extra store is installed with; the provisioner adds the name and token. */ -}}
{{- $storeValues := dict
  "global" (merge (dict "gateway" (dict "release" $r "namespace" .Release.Namespace)) (deepCopy .Values.global))
  "certManager" (dict "createClusterIssuer" false)
  "store" (merge (dict "enabled" true "images" $store.images "site" $store.site "admin" $store.admin) (deepCopy .Values.provisioner.storeResources))
  "woo-mcp" (dict "enabled" true "image" $woo.image "storeTimezone" $woo.storeTimezone)
  "utils-mcp" (dict "enabled" false)
  "gateway" (dict "enabled" false)
  "dashboard" (dict "enabled" false)
  "provisioner" (dict "enabled" false) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
---
# What the provisioner may do cluster-wide: manage namespaces and set each one
# up (quota, limits, a RoleBinding to the tenant role below). The admission
# policy further down narrows every write to store namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create, update, patch]
  # May hand out the tenant role (and only that one) through a RoleBinding.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [{{ $name }}-tenant]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels: {{- include "platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Everything a store release contains. Granted only inside each store
# namespace, by a RoleBinding the provisioner creates there.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-tenant
  labels: {{- include "platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services, persistentvolumeclaims, pods, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
{{- if .Values.provisioner.admissionPolicy }}
---
# RBAC cannot say "only namespaces you created". This can: every write by the
# provisioner must target a namespace labelled as one of its stores (both
# before and after the change), or an object inside one.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-stores-only
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        resources: ["*"]
        operations: [CREATE, UPDATE, DELETE]
  matchConditions:
    - name: only-the-provisioner
      expression: request.userInfo.username == {{ $sa | quote }}
  validations:
    - expression: >-
        request.resource.resource == 'namespaces'
        ? ((request.operation == 'CREATE' || (has(oldObject.metadata.labels) && oldObject.metadata.labels[?'urumi.io/stores-of'].orValue('') == {{ $ownerId | quote }}))
           && (request.operation == 'DELETE' || (has(object.metadata.labels) && object.metadata.labels[?'urumi.io/stores-of'].orValue('') == {{ $ownerId | quote }})))
        : (namespaceObject != null && has(namespaceObject.metadata.labels)
           && namespaceObject.metadata.labels[?'urumi.io/stores-of'].orValue('') == {{ $ownerId | quote }})
      message: the provisioner may only change its own store namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-stores-only
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}-stores-only
  validationActions: [Deny]
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-store-values
  labels: {{- include "platform.labels" . | nindent 4 }}
data:
  store-values.yaml: |
    {{- toYaml $storeValues | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: provisioner
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $r }}
    app.kubernetes.io/name: provisioner
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: provisioner
spec:
  replicas: 1
  # One instance at a time: it serializes Helm operations in memory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $r }}
      app.kubernetes.io/name: provisioner
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: provisioner
      annotations:
        # Restart when the shared store values change.
        checksum/store-values: {{ toYaml $storeValues | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: provisioner
          image: "{{ .Values.provisioner.image.repository }}:{{ .Values.provisioner.image.tag }}"
          imagePullPolicy: {{ .Values.provisioner.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NAMESPACE_PREFIX
              value: {{ $prefix | quote }}
            - name: OWNER_ID
              value: {{ $ownerId | quote }}
            - name: SERVICE_ACCOUNT
              value: {{ $name }}
            - name: SERVICE_ACCOUNT_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: TENANT_CLUSTER_ROLE
              value: {{ $name }}-tenant
            - name: STORE_QUOTA
              value: {{ toJson .Values.provisioner.quota | quote }}
            - name: STORE_LIMIT_RANGE
              value: {{ toJson .Values.provisioner.limitRange | quote }}
            - name: PARALLEL_INSTALLS
              value: {{ .Values.provisioner.parallelInstalls | quote }}
            - name: INSTALL_TIMEOUT_SECONDS
              value: {{ .Values.provisioner.installTimeoutSeconds | quote }}
            - name: DOMAIN
              value: {{ .Values.global.domain | quote }}
            - name: TLS
              value: {{ .Values.global.ingress.tls | quote }}
            - name: MAX_STORES
              value: {{ .Values.provisioner.maxStores | quote }}
            - name: VALUES_FILE
              value: /config/store-values.yaml
            - name: PROVISIONER_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $r }}-provisioner-token, key: token }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.provisioner.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-store-values
        - name: tmp
          emptyDir: {}
{{- end }}
