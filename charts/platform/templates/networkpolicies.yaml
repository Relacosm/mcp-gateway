{{- if .Values.global.networkPolicies }}
{{- /*
Only the gateway may reach the MCP servers, its own Postgres and the store
provisioner; only a store's own WordPress and setup Job may reach its MariaDB;
only the Ingress controller and the store's own pods may reach its WordPress.
The dashboard and gateway stay open to the Ingress controller.

A store created by the provisioner is its own release in another namespace,
so "the gateway" is identified by its release and namespace (global.gateway),
which default to this release.
*/ -}}
{{- $r := .Release.Name -}}
{{- $gwRelease := .Values.global.gateway.release | default $r -}}
{{- $gwNamespace := .Values.global.gateway.namespace | default .Release.Namespace -}}
{{- $targets := list -}}
{{- if index .Values "woo-mcp" "enabled" }}{{ $targets = append $targets (dict "name" "woo-mcp" "port" 3000) }}{{ end -}}
{{- if index .Values "utils-mcp" "enabled" }}{{ $targets = append $targets (dict "name" "utils-mcp" "port" 3000) }}{{ end -}}
{{- if .Values.gateway.enabled }}{{ $targets = append $targets (dict "name" "gateway-postgres" "port" 5432) }}{{ end -}}
{{- if .Values.provisioner.enabled }}{{ $targets = append $targets (dict "name" "provisioner" "port" 3000) }}{{ end -}}
{{- range $t := $targets }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $r }}-{{ $t.name }}-from-gateway
  labels: {{- include "platform.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $r }}
      app.kubernetes.io/name: {{ $t.name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # Both selectors in one entry: gateway pods in the gateway's namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gwNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $gwRelease }}
              app.kubernetes.io/name: gateway
      ports:
        - port: {{ $t.port }}
          protocol: TCP
{{- end }}
{{- if .Values.store.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $r }}-store-mariadb-from-wordpress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $r }}
      app.kubernetes.io/name: store-mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $r }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [store-wordpress, store-setup]
      ports:
        - port: 3306
          protocol: TCP
---
# A storefront is reached by the ingress controller and by its own release
# (its woo-mcp server and setup Job), never by another store's pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $r }}-store-wordpress-from-ingress
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $r }}
      app.kubernetes.io/name: store-wordpress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.ingress.controllerNamespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $r }}
      ports:
        - port: 80
          protocol: TCP
{{- end }}
{{- end }}
