{{- /*
Secrets shared between subcharts live here, so every consumer reads the same
value. Names follow "<release>-<purpose>"; subcharts reference them by name.
Each is rendered only when a component that uses it is enabled, so a store
installed by the provisioner (store + woo-mcp only) gets just its own secrets.
*/ -}}
{{- $s := .Values.secrets -}}
{{- $r := .Release.Name -}}
{{- $gateway := .Values.gateway.enabled -}}
{{- if .Values.store.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-store-db
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  root-password: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-store-db" $r) "key" "root-password" "value" $s.storeDbRootPassword) | b64enc }}
  password: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-store-db" $r) "key" "password" "value" $s.storeDbPassword) | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-store-admin
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-store-admin" $r) "key" "password" "value" $s.storeAdminPassword "length" 20) | b64enc }}
---
# WooCommerce REST API key. The store setup Job registers it in WooCommerce;
# only the Woo MCP server reads it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-woo-api
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-woo-api" $r) "key" "consumer-key" "value" $s.wooConsumerKey "length" 40 "prefix" "ck_") | b64enc }}
  consumer-secret: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-woo-api" $r) "key" "consumer-secret" "value" $s.wooConsumerSecret "length" 40 "prefix" "cs_") | b64enc }}
{{- end }}
{{- if or (index .Values "woo-mcp" "enabled") $gateway }}
---
# Bearer token the Woo MCP server requires. Only the gateway holds it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-woo-mcp-token
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-woo-mcp-token" $r) "key" "token" "value" $s.wooMcpToken "length" 48) | b64enc }}
{{- end }}
{{- if or (index .Values "utils-mcp" "enabled") $gateway }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-utils-mcp-token
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-utils-mcp-token" $r) "key" "token" "value" $s.utilsMcpToken "length" 48) | b64enc }}
{{- end }}
{{- if $gateway }}
---
# Key for the chat agent's LLM provider. Never generated: empty means the
# provider needs no key (for example a local Ollama).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-llm
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-llm" $r) "key" "api-key" "value" $s.llmApiKey "generate" false) | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-gateway
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-gateway" $r) "key" "db-password" "value" $s.gatewayDbPassword) | b64enc }}
  master-key: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-gateway" $r) "key" "master-key" "value" $s.gatewayMasterKey "length" 48) | b64enc }}
  admin-password: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-gateway" $r) "key" "admin-password" "value" $s.gatewayAdminPassword "length" 20) | b64enc }}
{{- end }}
{{- if .Values.provisioner.enabled }}
---
# Shared by the gateway and the store provisioner.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r }}-provisioner-token
  labels: {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "platform.secret" (dict "ctx" $ "name" (printf "%s-provisioner-token" $r) "key" "token" "value" $s.provisionerToken "length" 48) | b64enc }}
{{- end }}
