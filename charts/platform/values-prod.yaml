# k3s on a VPS. Everything that differs from local lives here.
# Real secrets are passed at install time (--set or an untracked
# prod.secret.yaml), never committed. See README "Deploy to a VPS".
#
#   helm upgrade --install platform charts/platform -n urumi --create-namespace \
#     -f charts/platform/values-prod.yaml -f prod.secret.yaml --timeout 15m --wait
global:
  # Hosts are store.<domain>, gateway.<domain> and <store>.<domain>, so point a
  # wildcard A record (*.<domain>) at the VPS.
  domain: urumi.relacosm.com
  ingress:
    className: traefik
    tls: true
    # cert-manager issues a Let's Encrypt certificate per Ingress.
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
  storageClass: local-path
  networkPolicies: true

# Creates the Let's Encrypt ClusterIssuer (cert-manager must be installed first).
certManager:
  createClusterIssuer: true
  email: ops@example.com

store:
  images:
    wordpress: ghcr.io/relacosm/urumi-store-wordpress:0.1.0
  admin:
    email: ops@example.com
  mariadb:
    storage: 10Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }
  wordpress:
    storage: 10Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }

woo-mcp:
  image:
    repository: ghcr.io/relacosm/urumi-woo-mcp
    tag: "0.1.0"
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

utils-mcp:
  image:
    repository: ghcr.io/relacosm/urumi-utils-mcp
    tag: "0.1.0"
  replicas: 2

gateway:
  image:
    repository: ghcr.io/relacosm/urumi-gateway
    tag: "0.1.0"
  # Upstream connections and rate-limit counters are per replica; 1 keeps the
  # limit exact. Raise it if you accept per-replica limits.
  replicas: 1
  admin:
    email: ops@example.com
  # Any OpenAI-compatible provider. Groq shown; the key goes in secrets.llmApiKey.
  llm:
    baseUrl: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    timeoutMs: 60000
    sequentialTools: false
  resources:
    requests: { cpu: 200m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }
  postgres:
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

provisioner:
  image:
    repository: ghcr.io/relacosm/urumi-provisioner
    tag: "0.1.2"
  # Each store is <name>.<domain>: add a wildcard DNS record (*.<domain>).
  # Sized for an 8 GB VPS; each extra store reserves roughly 1 GB.
  maxStores: 3

dashboard:
  image:
    repository: ghcr.io/relacosm/urumi-dashboard
    tag: "0.1.2"
  replicas: 2
