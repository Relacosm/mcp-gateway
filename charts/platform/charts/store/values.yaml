# Public host is <host>.<global.domain>
host: store

images:
  mariadb: mariadb:11.4
  # WordPress 7.0 with WooCommerce pre-installed (services/store-wordpress).
  wordpress: urumi/store-wordpress:0.1.0
  cli: wordpress:cli-php8.3

admin:
  username: admin
  email: admin@example.com

site:
  title: Urumi Store
  timezone: Asia/Kolkata
  country: "IN:KA"
  currency: INR
  address: "1 MG Road"
  city: Bengaluru
  postcode: "560001"

woocommerce:
  # Only used if the image has no WooCommerce baked in. Empty = latest.
  version: ""

mariadb:
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

wordpress:
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

setup:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
