{{- if .Values.skin.enabled }}
# Storefront look (mono, light/dark), loaded as a must-use plugin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "store.wp" . }}-skin
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-wordpress
data:
  urumi-skin.php: |
    {{- .Files.Get "files/urumi-skin.php" | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "store.wp" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.wordpress.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.wp" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-wordpress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.wp" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-wordpress
spec:
  replicas: 1
  # The content volume is ReadWriteOnce: stop the old pod before starting a new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: store-wordpress
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/name: store-wordpress
      {{- if .Values.skin.enabled }}
      annotations:
        # Restart when the skin changes (subPath mounts do not update in place).
        checksum/skin: {{ .Files.Get "files/urumi-skin.php" | sha256sum }}
      {{- end }}
    spec:
      # Apache runs as www-data (uid 33) from the start instead of starting as
      # root; the sysctl lets a non-root process bind port 80 (namespaced, safe).
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{- include "store.wpDbEnv" . | nindent 12 }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_MEMORY_LIMIT', '256M');
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: content
              mountPath: /var/www/html
            {{- if .Values.skin.enabled }}
            - name: skin
              mountPath: /var/www/html/wp-content/mu-plugins/urumi-skin.php
              subPath: urumi-skin.php
              readOnly: true
            {{- end }}
          # wp-login.php runs PHP and opens the DB, so a broken DB fails readiness.
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ include "store.wp" . }}
        {{- if .Values.skin.enabled }}
        - name: skin
          configMap:
            name: {{ include "store.wp" . }}-skin
        {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "store.wp" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/name: store-wordpress
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts: [{{ printf "%s.%s" .Values.host .Values.global.domain | quote }}]
      secretName: {{ include "store.wp" . }}-tls
  {{- end }}
  rules:
    - host: {{ printf "%s.%s" .Values.host .Values.global.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "store.wp" . }}
                port:
                  name: http
