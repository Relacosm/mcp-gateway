{{- $name := printf "%s-gateway" .Release.Name -}}
{{- $host := printf "%s.%s" .Values.host .Values.global.domain -}}
{{- $r := .Release.Name -}}
{{- $seeds := list
  (dict "name" "WooCommerce" "slug" "woo" "url" (printf "http://%s-woo-mcp:3000/mcp" $r) "tokenEnv" "SEED_TOKEN_WOO")
  (dict "name" "Utils" "slug" "utils" "url" (printf "http://%s-utils-mcp:3000/mcp" $r) "tokenEnv" "SEED_TOKEN_UTILS") -}}
{{- $seeds = concat $seeds (.Values.extraSeedServers | default list) -}}
{{- $internal := concat (list (printf "%s-woo-mcp" $r) (printf "%s-utils-mcp" $r)) (.Values.allowedInternalHosts | default list) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: platform
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PGHOST
              value: {{ .Release.Name }}-gateway-postgres
            - name: PGDATABASE
              value: gateway
            - name: PGUSER
              value: gateway
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-gateway, key: db-password }
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-gateway, key: master-key }
            - name: ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-gateway, key: admin-password }
            - name: SEED_SERVERS
              value: {{ $seeds | toJson | quote }}
            - name: SEED_TOKEN_WOO
              valueFrom:
                secretKeyRef: { name: {{ $r }}-woo-mcp-token, key: token }
            - name: SEED_TOKEN_UTILS
              valueFrom:
                secretKeyRef: { name: {{ $r }}-utils-mcp-token, key: token }
            - name: SSRF_PROTECTION
              value: {{ .Values.ssrfProtection | quote }}
            - name: ALLOWED_INTERNAL_HOSTS
              value: {{ join "," $internal | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.rateLimitPerMinute | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: LLM_TIMEOUT_MS
              value: {{ .Values.llm.timeoutMs | quote }}
            - name: CHAT_SEQUENTIAL_TOOLS
              value: {{ .Values.llm.sequentialTools | quote }}
            - name: CHAT_MAX_STEPS
              value: {{ .Values.llm.maxSteps | quote }}
            # Store provisioner (only present when provisioner.enabled).
            - name: PROVISIONER_URL
              value: "http://{{ $r }}-provisioner:3000"
            - name: PROVISIONER_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $r }}-provisioner-token, key: token, optional: true }
            - name: MAX_STORES_PER_USER
              value: {{ .Values.maxStoresPerUser | default 2 | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ $r }}-llm, key: api-key, optional: true }
            - name: COOKIE_SECURE
              value: {{ .Values.global.ingress.tls | quote }}
            - name: CALL_TIMEOUT_MS
              value: {{ .Values.callTimeoutMs | quote }}
            - name: HEALTH_TIMEOUT_MS
              value: {{ .Values.healthTimeoutMs | quote }}
            - name: HEALTH_INTERVAL_MS
              value: {{ .Values.healthIntervalMs | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # /healthz also checks Postgres; /livez only checks the process.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: gateway
  {{- with .Values.global.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if .Values.global.ingress.tls }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $name }}-tls
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
